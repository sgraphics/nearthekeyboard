# NTK (Near The Keyboard) on ntk.tools: the verify page, the demo feed, the web
# embed, the app's wallet login (/login/) and the privacy page as static files
# from /opt/ntk/web, and the relay (/api/ -> 127.0.0.1:3970,
# deploy/ntk-relay.service). A site file of its own, installed by
# deploy/deploy.sh; it shares nothing with the other sites on this server.
#
# Port 80 serves the site directly (works behind Cloudflare "Flexible" and lets
# ACME HTTP-01 through). Port 4443 terminates TLS: port 443 on this host is the
# SNI stream proxy to 4443, as for the other site.
#
# Lines ending in "# tls" need the certificate /etc/letsencrypt/live/ntk.tools/.
# Until it exists, deploy.sh installs this file without those lines (HTTP only)
# and prints the certbot command.

upstream ntk_relay {
    server 127.0.0.1:3970;
    keepalive 8;
}

# ---------- www.ntk.tools -> ntk.tools, path and query kept ----------

server {
    listen 80;
    listen [::]:80;
    listen 4443 ssl;  # tls
    server_name www.ntk.tools;

    ssl_certificate /etc/letsencrypt/live/ntk.tools/fullchain.pem;  # tls
    ssl_certificate_key /etc/letsencrypt/live/ntk.tools/privkey.pem;  # tls
    include /etc/letsencrypt/options-ssl-nginx.conf;  # tls
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;  # tls

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://ntk.tools$request_uri;
    }
}

# ---------- ntk.tools ----------

server {
    listen 80;
    listen [::]:80;
    listen 4443 ssl;  # tls
    server_name ntk.tools;

    ssl_certificate /etc/letsencrypt/live/ntk.tools/fullchain.pem;  # tls
    ssl_certificate_key /etc/letsencrypt/live/ntk.tools/privkey.pem;  # tls
    include /etc/letsencrypt/options-ssl-nginx.conf;  # tls
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;  # tls

    root /opt/ntk/web;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Redirects say "/feed/", not "https://ntk.tools:4443/feed/" (TLS arrives on 4443 behind the SNI proxy).
    absolute_redirect off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # The verify page reads stamps from OutLayer's public storage in the browser; nothing else leaves the page.
    # These headers apply to every location below except /login/, which repeats them with a CSP of its own
    # (expires does not count as add_header).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://testnet-api.outlayer.ai; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;  # tls

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # The relay: holds the OutLayer payment key (deploy/ntk-relay.service). It sets its own CORS headers.
    location /api/ {
        proxy_pass http://ntk_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        error_page 502 503 504 = @ntk_relay_down;
    }
    location @ntk_relay_down {
        default_type application/json;
        return 503 '{"error":"the NTK relay is not running"}';
    }

    # /<stamp id>#t=<text>: the verify page. The fragment (#t=...) never reaches a server.
    location ~ "^/[0-9a-f]{10}$" {
        try_files /index.html =404;
        expires epoch;
    }

    location = /feed {
        return 301 /feed/;
    }
    location = /login {
        return 301 /login/;
    }
    location = /privacy {
        return 301 /privacy/;
    }
    location = /messages {
        return 301 /messages/;
    }

    # /login/#pk=...&return=ntk://auth: the NTK app's wallet login (web/login/). Its wallet connector
    # (@hot-labs/near-connect) runs each wallet's script as inline scripts in a sandboxed srcdoc iframe, and
    # such an iframe inherits this page's CSP. So this location has a CSP of its own: a fresh nonce per
    # response for those scripts (sub_filter writes it into the page, whose script hands it to the
    # connector), inline styles for the connector's dialogs, and the hosts the two wallets it offers
    # (Meteor, Intear) and the testnet RPC need. add_header here replaces every server-level header, so
    # each one is repeated below.
    location /login/ {
        try_files $uri $uri/ =404;
        expires epoch;
        sub_filter 'NTK_CSP_NONCE' '$request_id';
        sub_filter_once on;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline' https://rsms.me https://fonts.cdnfonts.com; img-src 'self' data: https://raw.githubusercontent.com https://meteorwallet.app; font-src 'self' data: https://rsms.me https://fonts.cdnfonts.com; connect-src 'self' https://rpc.testnet.fastnear.com https://test.rpc.fastnear.com https://raw.githubusercontent.com https://wallet.intear.tech wss://logout-bridge-service.intear.tech https://mc.meteorwallet.app wss://mc.meteorwallet.app; frame-src https://wallet.intear.tech meteorwallet: intear:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;  # tls
    }

    location = /favicon.ico {
        try_files /assets/favicon.ico =404;
        expires 1h;
    }

    # Tests and dotfiles live in the repository, not on the site.
    location ^~ /test/ {
        return 404;
    }
    location ~ /\. {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }

    # Pages, modules and the embed: always revalidated (no build step, so no hashed names).
    location / {
        try_files $uri $uri/ =404;
        expires epoch;
    }
}
