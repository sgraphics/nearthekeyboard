[package]
name = "ntk-enclave"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "NTK (Near The Keyboard): a typing-fingerprint enclave that runs on NEAR OutLayer inside Intel TDX"

[[bin]]
name = "ntk-enclave"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"

# The OutLayer host interfaces exist only inside the worker, so the SDK is a
# wasm-only dependency; `cargo test` on the host runs the pure logic in
# model.rs and crypto.rs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
outlayer = { version = "0.2.1", features = ["signing-keys", "encryption-keys"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
