# Unit tests on every push. No secrets: nothing here calls the enclave or the relay.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels the run of an older one.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  enclave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Unit tests (text rule, crypto, shared test vectors)
        run: cargo test --release
        working-directory: enclave
      - name: Reproducible build; its hash must be the one the README names
        run: |
          bash enclave/build-reproducible.sh | tee /tmp/wasm-hash
          hash=$(tail -1 /tmp/wasm-hash | cut -d' ' -f1)
          grep -q "$hash" README.md || { echo "README.md does not name $hash"; exit 1; }

  web-and-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify page, feed, embed, reference verifier, relay, deploy files
        run: node --test "web/test/*.test.mjs" "relay/test/*.test.mjs"
      - name: Secret check
        run: node scripts/check-secrets.mjs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Its default package list includes "tools", which cmdline-tools 16 no longer has.
      # Gradle downloads the SDK platform the build needs by itself.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Trust check of the keyboard tree
        run: bash scripts/audit-android.sh
      - name: JVM unit tests (text rule, sealing, NEP-413, stamps)
        run: ./gradlew --no-daemon testDebugUnitTest
        working-directory: android
